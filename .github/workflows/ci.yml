name: Cinema Microservices CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

# Отменяем старые запущенные билды в той же ветке, если прилетел новый коммит
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================
  # ЭТАП 1: Компиляция, миграции и запуск интеграционных тестов
  # =============================================================
  test-and-verify:
    name: Run Tests & Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Включаем автоматический кэш зависимостей Gradle
          cache: 'gradle'

      - name: Make Gradlew executable
        run: chmod +x ./gradlew

      - name: Run all tests (including Testcontainers)
        env:
          # Ограничиваем аппетиты Gradle в виртуалке GitHub Actions (доступно 7GB RAM)
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"
        run: |
          ./gradlew test --no-daemon --continue --stacktrace

      - name: Upload Test Results if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  # =============================================================
  # ЭТАП 2: Параллельная сборка JAR и проверка Docker-образов
  # =============================================================
  build-docker-images:
    name: Build Docker Image (${{ matrix.service }})
    needs: test-and-verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Запускаем параллельную сборку сразу для всех сервисов!
        service:
          - discovery-server
          - auth-service
          - gateway-service
          - movie-service
          - booking-service
          - payment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradlew executable
        run: chmod +x ./gradlew

      - name: Compile BootJar for ${{ matrix.service }}
        run: |
          ./gradlew :${{ matrix.service }}:bootJar --no-daemon

      - name: Build Docker Image
        run: |
          docker build \
            -t cinema/${{ matrix.service }}:${{ github.sha }} \
            -f ./${{ matrix.service }}/Dockerfile \
            ./${{ matrix.service }}

      - name: Tag as latest
        run: |
          docker tag cinema/${{ matrix.service }}:${{ github.sha }} cinema/${{ matrix.service }}:latest