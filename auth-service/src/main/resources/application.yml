server:
  port: 8081

spring:
  data:
    redis:
      host: redis
      port: 6379
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/teacinema_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:your_password}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
grpc:
  server:
    port: 9091

jwt:
  # Можно сгенерировать рандомную строку через openssl rand -base64 32
  secret: ${JWT_SECRET:your-very-secure-and-long-secret-key-for-teacinema-project}
  #аксес токен(типо максы 15 мин - час по идее потом сделать)
  expiration: 86400000 # 24 часа