server:
  port: 8081 # Рекомендую 8081, 5000 часто занят системой

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/teacinema_db
    username: postgres
    password: your_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# gRPC должен быть на самом верхнем уровне, а не внутри spring
grpc:
  server:
    port: 9091