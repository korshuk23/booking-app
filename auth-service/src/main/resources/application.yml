server:
  port: 8081

spring:
  data:
    redis:
      host: localhost
      port: 6379
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/auth_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

grpc:
  server:
    port: 9091

jwt:
  # Можно сгенерировать рандомную строку через openssl rand -base64 32
  secret: ${JWT_SECRET:your-very-secure-and-long-secret-key-for-teacinema-project}
  #аксес токен(типо максы 15 мин - час по идее потом сделать)
  expiration: 86400000 # 24 часа