plugins {
    id 'org.springframework.boot'
}

description = 'auth-service'

dependencies {
    // 1. Наш общий модуль
    implementation project(':core')

    // 2. gRPC Server Starter (вырезаем внутренний gRPC, чтобы не было конфликта с :core)
    implementation('net.devh:grpc-server-spring-boot-starter:3.1.0.RELEASE') {
        exclude group: 'io.grpc'
    }

    // 3. Web, DB, Redis
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 4. JWT (здесь он нужен для генерации токенов после проверки OTP)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // 5. Liquibase
    implementation 'org.liquibase:liquibase-core'

    // 6. Eureka
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // 7. Actuator для сбора метрик и здоровья
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 8. Prometheus для отдачи метрик (CPU, память, HTTP-запросы)
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // 9. OpenTelemetry для распределенной трассировки
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
}

tasks.named('test') {
    useJUnitPlatform()
}
