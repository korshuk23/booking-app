server:
  port: 8083

spring:
  application:
    name: movie-service
  datasource:
    url: jdbc:postgresql://localhost:5432/teacinema_db
    username: postgres
    password: your_password
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    # Путь к главному файлу (мы сделаем его .sql или .yaml для удобства)
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      # Теперь только проверяем, что таблицы созданы правильно
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true