server:
  port: 8083

spring:
  application:
    name: movie-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/movie_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: localhost:29092

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

seat:
  reservation:
    timeout-minutes: ${SEAT_RESERVATION_TIMEOUT_MIN:15}
  release:
    job-rate-ms: ${SEAT_RELEASE_JOB_RATE_MS:60000}

movie:
  cache:
    ttl-minutes: ${MOVIE_CACHE_TTL_MIN:10}

outbox:
  retention:
    days: ${OUTBOX_RETENTION_DAYS:3}
  cleanup:
    cron: ${OUTBOX_CLEANUP_CRON:0 0 * * * *}

grpc:
  server:
    port: 9093

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    tracing:
      sampling:
        probability: 1.0 # В проде ставят 0.1 (10%), для тестов пишем 100% трейсов
    otlp:
      tracing:
        endpoint: http://${TEMPO_HOST:localhost}:4318/v1/traces # Куда шлем трейсы (Tempo)

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"