plugins {
    id 'org.springframework.boot'
}

description = 'movie-service'

dependencies {
    // 1. Наш общий модуль
    implementation project(':core')

    // 2. Стандартный стек для REST-API и работы с БД
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // 3. Redis & Spring Cache (НОВОЕ!)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // 4. Actuator для метрик и здоровья (НОВОЕ!)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 5. Зависимость для gRPC КЛИЕНТА и СЕРВЕРА
    implementation 'net.devh:grpc-client-spring-boot-starter:3.1.0.RELEASE'
    implementation 'net.devh:grpc-server-spring-boot-starter:3.1.0.RELEASE'

    // 6. Liquibase
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // 7. Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.3'

    // 8. Actuator для сбора метрик и здоровья
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 9. Prometheus для отдачи метрик (CPU, память, HTTP-запросы)
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // 10. OpenTelemetry для распределенной трассировки
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
}

tasks.named('test') {
    useJUnitPlatform()
}