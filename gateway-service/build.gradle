plugins {
    id 'org.springframework.boot'
}

description = 'gateway-service'

dependencies {
    // 1. Базовый стек Gateway и мониторинг
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 2. Наш общий модуль
    implementation project(':core')

    implementation "io.grpc:grpc-netty:1.80.0"

    implementation('net.devh:grpc-client-spring-boot-starter:3.1.0.RELEASE') {
        exclude group: 'io.grpc'
    }

    // 5. JWT для проверки токенов в AuthFilter
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // 6. Eureka
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // 7. Стартер для работы Spring Cloud Gateway в качестве Resource Server (OAuth2)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // 8. OpenAPI / Swagger для реактивного Gateway
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.3'

    // 9. Resilience4j
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // 10. Actuator для сбора метрик и здоровья
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 11. Prometheus для отдачи метрик (CPU, память, HTTP-запросы)
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // 12. OpenTelemetry для распределенной трассировки
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
}

tasks.named('test') {
    useJUnitPlatform()
}