plugins {
    id("java")
    id("org.springframework.boot")
    id("io.spring.dependency-management") // Добавь этот плагин для управления зависимостями
}

description = 'gateway-service'

dependencies {
    // 1. Оставляем BOM для выравнивания версий
    implementation platform('io.grpc:grpc-bom:1.53.0')

    // 2. Базовый стек Gateway
    implementation("org.springframework.cloud:spring-cloud-starter-gateway")
    implementation("org.springframework.boot:spring-boot-starter-actuator")
    implementation(project(":core"))

    // 3. gRPC СТЭК
    implementation 'net.devh:grpc-client-spring-boot-starter:2.15.0.RELEASE'

    // ВАЖНО: Добавляем ОБЫЧНЫЙ netty (не shaded), так как Gateway сидит на нем
    implementation 'io.grpc:grpc-netty'

    // Оставляем эти для совместимости
    implementation 'io.grpc:grpc-protobuf'
    implementation 'io.grpc:grpc-stub'

    // 4. JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // 5. LOMBOK
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}