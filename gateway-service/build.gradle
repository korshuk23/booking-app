plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'gateway-service'

dependencies {
    // 1. Базовый стек Gateway и мониторинг
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 2. Наш общий модуль (теперь он сам притащит gRPC 1.52.1)
    implementation project(':core')

    // Добавь это ПРЯМО СЕЙЧАС. Это даст Spring нужный NettyChannelBuilder
    implementation 'io.grpc:grpc-netty:1.52.1'

    // 3. gRPC Client Starter (вычищаем его внутренние зависимости gRPC, чтобы не мешали)
    implementation('net.devh:grpc-client-spring-boot-starter:2.15.0.RELEASE') {
        exclude group: 'io.grpc'
    }

    // 4. JWT для проверки токенов в AuthFilter
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // 5. Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 6. Тесты (не забудь удалить пустой GatewayServiceApplicationTests, чтобы не падал контекст)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}