server:
  port: 8088

springdoc:
  swagger-ui:
    # Путь, по которому будет доступен Swagger
    path: /swagger-ui.html
    # Включаем выбор разных сервисов
    urls:
      - name: Gateway Service
        url: /v3/api-docs
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # Маршрут для бронирования
        - id: booking-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/bookings/**
          # filters:
          #   - AuthFilter # Не забудь включить свой фильтр здесь

        # ДОБАВЬ ЭТОТ БЛОК:
        - id: movie-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/movies/**
          # filters:
          #   - AuthFilter # Не забудь включить свой фильтр здесь

        - id: auth-local
          uri: forward:///
          predicates:
            - Path=/api/v1/auth/**
        - id: auth-local
          uri: forward:/api/v1/auth
          predicates:
            Path=/api/v1/auth/**

grpc:
  client:
    auth-service:
      address: 'static://localhost:9091'
      negotiation-type: plaintext

# Настройка логирования, чтобы видеть, куда улетают запросы
logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG