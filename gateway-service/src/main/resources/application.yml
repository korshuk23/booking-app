server:
  port: 8088

springdoc:
  swagger-ui:
    # Путь, по которому будет доступен Swagger
    path: /swagger-ui.html
    # Включаем выбор разных сервисов
    urls:
      - name: Gateway Service
        url: /v3/api-docs
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # Маршрут для авторизации
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**

        # Маршрут для бронирования
        - id: booking-service
          uri: http://booking-service:8084
          predicates:
            - Path=/api/v1/bookings/**

        # ДОБАВЬ ЭТОТ БЛОК:
        - id: movie-service
          uri: http://movie-service:8083
          predicates:
            - Path=/api/v1/movies/**

grpc:
  client:
    auth-service:
      address: 'static://auth-service:9091'
      negotiationType: plaintext

# Настройка логирования, чтобы видеть, куда улетают запросы
logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG