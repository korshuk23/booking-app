server:
  port: 4000
springdoc:
  swagger-ui:
    # Путь, по которому будет доступен Swagger
    path: /swagger-ui.html
    # Включаем выбор разных сервисов
    urls:
      - name: Gateway Service
        url: /v3/api-docs
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # Маршрут для авторизации
        - id: auth-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        # Маршрут для бронирования
        - id: booking-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/bookings/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000" # Адрес твоего фронтенда
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"
            allowCredentials: true
      filter:
        json-to-grpc:
          enabled: false

# Настройка логирования, чтобы видеть, куда улетают запросы
logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG