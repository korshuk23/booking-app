server:
  port: 8088

springdoc:
  swagger-ui:
    # Путь, по которому будет доступен Swagger
    path: /swagger-ui.html
    # Включаем выбор разных сервисов
    urls:
      - name: Gateway Service
        url: /v3/api-docs
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # Маршрут для авторизации
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        # Маршрут для бронирования
        - id: booking-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/bookings/**

        # ДОБАВЬ ЭТОТ БЛОК:
        - id: movie-service
          uri: http://localhost:8083 # Неважно, что там пусто
          predicates:
            - Path=/api/v1/movies/**

grpc:
  client:
    auth-service:
      address: 'static://127.0.0.1:9091' # Порт, который мы открыли в Auth
      negotiationType: plaintext # Без SSL для локальной разработки

# Настройка логирования, чтобы видеть, куда улетают запросы
logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG