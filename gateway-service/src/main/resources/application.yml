server:
  port: 8088

springdoc:
  swagger-ui:
    # Путь, по которому будет доступен Swagger
    path: /swagger-ui.html
    # Включаем выбор разных сервисов
    urls:
      - name: Gateway Service
        url: /v3/api-docs
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/v1/bookings/**

        - id: movie-service
          uri: lb://movie-service
          predicates:
            - Path=/api/v1/movies/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

grpc:
  client:
    auth-service:
      address: 'discovery:///auth-service'
      negotiation-type: plaintext

# Настройка логирования, чтобы видеть, куда улетают запросы
logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG