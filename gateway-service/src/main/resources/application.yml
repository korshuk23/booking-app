server:
  port: 8088

springdoc:
  swagger-ui:
    # Путь, по которому будет доступен Swagger
    path: /swagger-ui.html
    # Включаем выбор разных сервисов
    urls:
      - name: Gateway Service
        url: /v3/api-docs
spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Адрес нашего Realm в Keycloak.
          # По этому URL Гейтвей сам найдет эндпоинт с публичными ключами (JWKS)
          issuer-uri: http://keycloak-cinema:8080/realms/teacinema
  cloud:
    gateway:
      routes:
        # Твой старый роут v1 (через gRPC)
        - id: booking-service-v1
          uri: lb://booking-service
          predicates:
            - Path=/api/v1/bookings/**
            -
        - id: movie-service
          uri: lb://movie-service
          predicates:
            - Path=/api/v1/movies/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

# Настройка логирования, чтобы видеть, куда улетают запросы
logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: DEBUG
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
