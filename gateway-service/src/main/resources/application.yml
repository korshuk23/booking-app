server:
  port: 8088

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Booking Service
        url: /v3/api-docs/booking-service
      - name: Movie Service
        url: /v3/api-docs/movie-service
      - name: Payment Service
        url: /v3/api-docs/payment-service

spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Адрес нашего Realm в Keycloak.
          # По этому URL Гейтвей сам найдет эндпоинт с публичными ключами (JWKS)
          issuer-uri: http://keycloak-cinema:8080/realms/teacinema
  cloud:
    gateway:
      routes:
        # Твой старый роут v1 (через gRPC)
        - id: booking-service-v1
          uri: lb://booking-service
          predicates:
            - Path=/api/v1/bookings/**
        - id: movie-service
          uri: lb://movie-service
          predicates:
            - Path=/api/v1/movies/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
            -
        # Проксирование OpenAPI документации от сервисов
        - id: booking-docs
          uri: lb://booking-service
          predicates:
            - Path=/v3/api-docs/booking-service/**
          filters:
            - RewritePath=/v3/api-docs/booking-service(?<segment>.*), /v3/api-docs$\{segment}

        - id: movie-docs
          uri: lb://movie-service
          predicates:
            - Path=/v3/api-docs/movie-service/**
          filters:
            - RewritePath=/v3/api-docs/movie-service(?<segment>.*), /v3/api-docs$\{segment}

        - id: payment-docs
          uri: lb://payment-service
          predicates:
            - Path=/v3/api-docs/payment-service/**
          filters:
            - RewritePath=/v3/api-docs/payment-service(?<segment>.*), /v3/api-docs$\{segment}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus # Открываем метрики для Prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0 # В проде ставят 0.1 (10%), для тестов пишем 100% трейсов
  otlp:
    tracing:
      endpoint: http://${TEMPO_HOST:localhost}:4318/v1/traces # Куда шлем трейсы (Tempo)


# Настройка логирования, чтобы видеть, куда улетают запросы
logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: DEBUG
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
