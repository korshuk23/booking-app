global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'cinema-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'gateway-service:8088'
          - 'auth-service:8081'
          - 'movie-service:8083'
          - 'booking-service:8084'
          - 'payment-service:8085'