server:
  port: 8084

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/booking_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: localhost:29092

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true


grpc:
  client:
    movie-service:
      address: 'static://movie-service:9093'
      negotiation-type: plaintext

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://${TEMPO_HOST:localhost}:4318/v1/traces #

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

resilience4j:
  circuitbreaker:
    instances:
      movieServiceCb:
        slidingWindowSize: 10 # Анализируем последние 10 запросов
        failureRateThreshold: 50 # Если 50% упали - размыкаем цепь
        waitDurationInOpenState: 10s # Ждем 10 секунд перед тестовым запуском
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      movieServiceRetry:
        maxAttempts: 3
        waitDuration: 500ms