server:
  port: 8084

spring:

  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/booking_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

booking:
  sse:
    timeout-ms: ${BOOKING_SSE_TIMEOUT_MS:60000}
    cache-ttl-minutes: 10
    max-emitters: 50000
    heartbeat-rate-ms: 15000

outbox:
  retention:
    days: ${OUTBOX_RETENTION_DAYS:3}
  cleanup:
    cron: ${OUTBOX_CLEANUP_CRON:0 0 * * * *}

grpc:
  client:
    movie-service:
      address: 'static://movie-service:9093'
      negotiation-type: plaintext


management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 0.1
  otlp:
    tracing:
      endpoint: http://${TEMPO_HOST:localhost}:4318/v1/traces #

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

resilience4j:
  circuitbreaker:
    instances:
      movieServiceCb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      movieServiceRetry:
        maxAttempts: 3
        waitDuration: 500ms