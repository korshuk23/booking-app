server:
  port: 8084

spring:
  application:
    name: booking-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/booking_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: localhost:29092

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

booking:
  sse:
    timeout-ms: ${BOOKING_SSE_TIMEOUT_MS:60000}
    cache-ttl-minutes: 10
    max-emitters: 50000
    heartbeat-rate-ms: 15000

outbox:
  retention:
    days: ${OUTBOX_RETENTION_DAYS:3}
  cleanup:
    cron: ${OUTBOX_CLEANUP_CRON:0 0 * * * *}

grpc:
  client:
    movie-service:
      address: 'static://movie-service:9093'
      negotiation-type: plaintext


management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://${TEMPO_HOST:localhost}:4318/v1/traces #

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

resilience4j:
  circuitbreaker:
    instances:
      movieServiceCb:
        slidingWindowSize: 10 # Анализируем последние 10 запросов
        failureRateThreshold: 50 # Если 50% упали - размыкаем цепь
        waitDurationInOpenState: 10s # Ждем 10 секунд перед тестовым запуском
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      movieServiceRetry:
        maxAttempts: 3
        waitDuration: 500ms