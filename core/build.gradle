plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'by.andrei.dev'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

// ЭТОТ БЛОК ЛЕЧИТ ОШИБКУ extractIncludeTestProto
configurations {
    testCompileProtoPath {
        exclude group: 'org.springframework.boot'
    }
}

dependencies {
    // gRPC стек (api - чтобы Gateway и Auth видели эти либы автоматически)
    api 'io.grpc:grpc-netty-shaded:1.52.1'
    api 'io.grpc:grpc-protobuf:1.52.1'
    api 'io.grpc:grpc-stub:1.52.1'

    // Аннотации для генерации кода
    api 'javax.annotation:javax.annotation-api:1.3.2'
    api 'jakarta.annotation:jakarta.annotation-api:2.1.1'

    // Чистый JUnit для тестов ядра (без Spring)
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.1"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.52.1"
        }
    }
    generateProtoTasks {
        all().forEach { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}