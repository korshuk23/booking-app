plugins {
    id("java-library")
    id("com.google.protobuf") version "0.9.4"
}

description = 'Shared gRPC Contracts'

// Этот блок заставит Gradle перестать искать зависимости Spring Boot в тестах core
configurations {
    testCompileProtoPath {
        exclude group: 'org.springframework.boot'
    }
}

dependencies {
    // Необходимые аннотации для генерации кода
    implementation("javax.annotation:javax.annotation-api:1.3.2")
    implementation("jakarta.annotation:jakarta.annotation-api:2.1.1")

    // gRPC зависимости
    implementation('io.grpc:grpc-netty-shaded:1.69.0')
    implementation("io.grpc:grpc-protobuf:1.69.0")
    implementation("io.grpc:grpc-stub:1.69.0")

    // Чистый JUnit для тестов, без Spring
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.1"
    }
    plugins {
        create("grpc") {
            artifact = "io.grpc:protoc-gen-grpc-java:1.69.0"
        }
    }
    generateProtoTasks {
        all().forEach { task ->
            task.plugins {
                create("grpc")
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs("build/generated/source/proto/main/grpc")
            srcDirs("build/generated/source/proto/main/java")
        }
    }
}