plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'by.andrei.dev'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // ОБНОВЛЕНО: Версии 1.62.2 более стабильны для новых JDK
    api 'io.grpc:grpc-netty-shaded:1.62.2'
    api 'io.grpc:grpc-protobuf:1.62.2'
    api 'io.grpc:grpc-stub:1.62.2'

    // Аннотации
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
    api 'jakarta.annotation:jakarta.annotation-api:2.1.1'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

protobuf {
    protoc {
        // ОБНОВЛЕНО: Версия protoc должна соответствовать gRPC
        artifact = "com.google.protobuf:protoc:3.25.1"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.62.2"
        }
    }
    generateProtoTasks {
        all().forEach { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

// Это поможет IDE и компилятору точно найти сгенерированные файлы
sourceSets {
    main {
        java {
            srcDirs += 'build/generated/source/proto/main/grpc'
            srcDirs += 'build/generated/source/proto/main/java'
        }
    }
}