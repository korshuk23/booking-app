syntax = "proto3";

package com.korshuk.dev.core;

// Опции для генерации Java кода
option java_multiple_files = true;
option java_package = "com.korshuk.dev.core.grpc";

// 1. Auth Service
service AuthService {
  // Метод для проверки токена (другие сервисы будут его вызывать)
  rpc ValidateToken (TokenRequest) returns (TokenResponse);
}

message TokenRequest {
  string access_token = 1;
}

message TokenResponse {
  string userId = 1;
  bool isValid = 2;
  string role = 3;
}

// 2. Booking Service
// Добавляем новый сервис для фильмов
service MovieService {
  rpc GetMovieInfo (MovieRequest) returns (MovieResponse);
}

message MovieRequest {
  int64 movieId = 1;
}

message MovieResponse {
  int64 movieId = 1;
  string title = 2;
  double price = 3;
  bool isAvailable = 4;
}
