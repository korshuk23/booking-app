syntax = "proto3";

package com.korshuk.dev.core;

// Опции для генерации Java кода
option java_multiple_files = true;
option java_package = "com.korshuk.dev.core.grpc";

// 1. Auth Service
service AuthService {
  rpc RequestOtp (OtpRequest) returns (OtpResponse);

  rpc VerifyOtp (VerifyRequest) returns (AuthResponse);

  rpc ValidateToken (TokenRequest) returns (TokenResponse);
}

message OtpRequest {
  string identifier = 1;
}

message OtpResponse {
  bool success = 1;
  string message = 2;
}

message VerifyRequest {
  string identifier = 1;
  string code = 2;
}

message AuthResponse {
  string access_token = 1;
  string user_id = 2;
}

message TokenRequest {
  string access_token = 1;
}

message TokenResponse {
  string user_id = 1;
  bool is_valid = 2;
  string role = 3;
}

// 2. Booking Service
service MovieService {
  rpc GetMovieInfo (MovieRequest) returns (MovieResponse);
}

message MovieRequest {
  int64 movie_id = 1;
}

message MovieResponse {
  int64 movie_id = 1;
  string title = 2;
  //Точность double!
  double price = 3;
  bool is_available = 4;
}
