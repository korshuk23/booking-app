apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      serviceMap:
        httpMethod: GET

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Настраиваем автоматический парсинг Trace ID из логов!
      derivedFields:
        - datasourceUid: Tempo # Ссылка на базу Tempo
          matcherRegex: "traceId=([a-zA-Z0-9]+)"
          name: TraceID
          url: "$${__value.raw}" # Значение, переданное в Tempo