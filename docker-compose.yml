version: '3.8'

services:
  # 1. Твоя база (оставляем как есть)
  postgres-db:
    image: postgres:15
    container_name: teacinema-db
    environment:
      POSTGRES_DB: teacinema_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
    ports:
      - "5432:5432"
    healthcheck: # Проверка готовности для зависимых сервисов
      test: [ "CMD-SHELL", "pg_isready -U postgres -d teacinema_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Auth Service
  auth-service:
    build: ./auth-service # Путь к папке, где лежит Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
      - "9091:9091" # grpc порт
    depends_on:
      postgres-db:
        condition: service_healthy # Ждем, пока поднимется база
    environment:
      - DB_HOST=postgres-db # Внутри сети докера стучимся по имени сервиса!
      - DB_USERNAME=postgres
      - DB_PASSWORD=your_password

  # 3. Movie Service
  movie-service:
    build: ./movie-service
    container_name: movie-service
    ports:
      - "8083:8083"
      - "9093:9093" # grpc порт
    depends_on:
      postgres-db:
        condition: service_healthy # Ждем, пока поднимется база
    environment:
      - DB_HOST=postgres-db
      - DB_USERNAME=postgres
      - DB_PASSWORD=your_password

  # 4. Booking Service
  booking-service:
    build: ./booking-service
    container_name: booking-service
    ports:
      - "8084:8084"
    depends_on:
      postgres-db:
        condition: service_healthy # Ждем, пока поднимется база
    environment:
      - DB_HOST=postgres-db
      - DB_USERNAME=postgres
      - DB_PASSWORD=your_password

  # 5. Gateway
  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8088:8088"
    depends_on:
      - auth-service
    environment:
      - GRPC_CLIENT_AUTH_SERVICE_ADDRESS=static://auth-service:9091

  # 6. Redis
  redis:
    image: redis:7-alpine
    container_name: teacinema-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # 7. Kafka
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-cinema
    ports:
      - "29092:29092"
    environment:
      # Настройки KRaft для официального образа
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:29092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:29092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0

volumes:
  postgres_data: